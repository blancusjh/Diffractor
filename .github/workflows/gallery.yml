name: Validated diffraction gallery

on:
  push:
    branches: ["main", "codex/coordinate-aware-fourier"]
    paths:
      - "src/**"
      - "examples/validation_gallery.py"
      - ".github/workflows/gallery.yml"
  pull_request:
    paths:
      - "src/**"
      - "examples/validation_gallery.py"
      - ".github/workflows/gallery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[examples]"
      - name: Generate and check physical benchmarks
        run: python examples/validation_gallery.py --output validation-results
      - name: Upload figures and numerical data
        uses: actions/upload-artifact@v4
        with:
          name: validated-diffraction-gallery
          path: validation-results/
          if-no-files-found: error
          retention-days: 30
      - name: Export review preview
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          print("GALLERY_PREVIEW_BEGIN")
          encoded = base64.b64encode(Path("validation-results/validation_gallery.png").read_bytes()).decode("ascii")
          for start in range(0, len(encoded), 2000):
              print("GALLERY_PNG:" + encoded[start:start + 2000])
          print("GALLERY_PREVIEW_END")
          print("GALLERY_METRICS:" + Path("validation-results/results.json").read_text().replace("\n", ""))
          PY
