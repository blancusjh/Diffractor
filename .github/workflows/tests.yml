name: Tests

on:
  push:
    branches: ["codex/coordinate-aware-fourier"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
        scipy: [false, true]
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install optional CZT engine
        if: matrix.scipy
        run: python -m pip install scipy
      - name: Verify core installation excludes SciPy
        if: ${{ !matrix.scipy }}
        run: python -c "import importlib.util; assert importlib.util.find_spec('scipy') is None"
      - name: Test
        run: python -m pytest -q
