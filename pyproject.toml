[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffraction"
version = "0.2.0"
description = "Scalar diffraction toolkit: Fresnel, Fraunhofer and angular-spectrum propagation with apertures and thin refracting surfaces"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["optics", "diffraction", "fourier-optics", "fresnel", "angular-spectrum"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
examples = [
  "scipy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
