[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffraction"
version = "0.5.0"
description = "Scalar diffraction toolkit: Fresnel, Fraunhofer and angular-spectrum propagation with apertures and thin refracting surfaces"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["optics", "diffraction", "fourier-optics", "fresnel", "angular-spectrum"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
# SciPy powers the optional chirp-Z transform engine (FT2/IFT2 engine="czt"),
# next_fft_size's 5-smooth sizing, and some example scripts. The core toolkit
# (matrix-DFT engine, power-of-two sizing) works without it.
examples = [
  "scipy>=1.10",
]
# Interactive GPU-rendered viewers (diffraction.viz). PyQt6 is one possible
# VisPy GUI backend; any supported backend works.
viz = [
  "vispy>=0.14",
  "PyQt6>=6.5",
]
# GPU-accelerated propagation (diffraction.AngularSpectrum on CUDA). Pick the
# CuPy wheel matching your CUDA toolkit, e.g. cupy-cuda11x.
gpu = [
  "cupy-cuda12x>=12.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
